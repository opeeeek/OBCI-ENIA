      neg.filter(o => o !== L).forEach(o => { v += gQ * o.psi[0] * o.qn; ex += ' + ' + qTxt + '·' + T(o.psi[0], 1) + '·' + Fp(o.qn, 3); ve += f.eqQ * f.KFI * o.psi[0] * o.qn; exe += ' + ' + T(f.eqQ * f.KFI, 2) + '·' + T(o.psi[0], 1) + '·' + Fp(o.qn, 3); });
      if (!w1 || v < w1.v) w1 = { n: 'STR (6.10), γ<sub>G,inf</sub>, wiodące ' + L.sym, v, ex, lead: L.sym };
      if (!w2 || ve < w2.v) w2 = { n: 'EQU (zestaw A), wiodące ' + L.sym, v: ve, ex: exe, lead: L.sym };
    });
    out.uplift = w1; out.upliftEQU = w2;
  }
  return out;
}

/* ---------- składowe względem połaci (zestawienie na krokiew / płatew) ---------- */
function slopeComp(mode, alpha, kind, v) {
  const a = rad(clamp(num(alpha, 0), 0, 89.9)), c = Math.cos(a), s = Math.sin(a);
  if (mode === 'proj') { // pionowo, na m² rzutu
    if (kind === 'G') return { n: v / c, t: 0, f: '/cos α' };
    return { n: v, t: 0, f: '' };
  }
  if (mode === 'perp') { // prostopadle (n) i równolegle (t) do połaci, na m² połaci
    if (kind === 'G') return { n: v * c, t: v * s, f: '·cos α' };
    if (kind === 'S' || kind === 'Q') return { n: v * c * c, t: v * c * s, f: '·cos²α' };
    return { n: v, t: 0, f: '' }; // wiatr – prostopadle do połaci
  }
  return { n: v, t: 0, f: '' };
}

<script>/* js/svg.js */
/* ObciążeniaEC – rysunki SVG (schematy obciążeń, strefy wiatru, przekroje warstw, mapa stref) */
(function (root) {
'use strict';
const EC = root.EC;
const { F, clamp, isNum, rad } = EC;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const strip = s => String(s == null ? '' : s).replace(/<sub>(.*?)<\/sub>/g, '$1').replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '');
function arrow(x1, y1, x2, y2) {
  const a = Math.atan2(y2 - y1, x2 - x1), s = 5;
  const p1 = [x2 - s * Math.cos(a - 0.45), y2 - s * Math.sin(a - 0.45)], p2 = [x2 - s * Math.cos(a + 0.45), y2 - s * Math.sin(a + 0.45)];
  return `<line class="arr" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/><path class="arrh" d="M${x2.toFixed(1)} ${y2.toFixed(1)}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z"/>`;
}
const fig = (svg, cap) => `<figure>${svg}<figcaption>${cap}</figcaption></figure>`;

/* ---------- śnieg ---------- */
function snow(d, cases) {
  if (!d) return '';
  const X0 = 22, X1 = 278, GY = 124, Wd = X1 - X0;
  let roof = '', top = 80, yb, lx0 = X0, lx1 = X1, mapX = null, extra = '';
  const tn = a => Math.tan(rad(clamp(a || 0, 0, 80)));
  if (d.shape === 'mono') { const r = clamp(tn(d.a1) * 70, 2, 44); roof = `<path class="bld" d="M${X0} ${GY}V104L${X1} ${104 - r}V${GY}Z"/>`; top = 104 - r; }
  else if (d.shape === 'duo') {
    const t1 = tn(d.a1), t2 = tn(d.a2);
    const xr = t1 + t2 > 0 ? X0 + Wd * t2 / (t1 + t2) : (X0 + X1) / 2;
    const hr = clamp(t1 + t2 > 0 ? Wd * t1 * t2 / (t1 + t2) * 0.4 : 0, 3, 44);
    roof = `<path class="bld" d="M${X0} ${GY}V106L${xr.toFixed(1)} ${(106 - hr).toFixed(1)}L${X1} 106V${GY}Z"/>`; top = 106 - hr;
    mapX = f => f <= 0.5 ? X0 + (xr - X0) * f / 0.5 : xr + (X1 - xr) * (f - 0.5) / 0.5;
  } else if (d.shape === 'multi') {
    const q = Wd / 4;
    roof = `<path class="bld" d="M${X0} ${GY}V108L${X0 + q} 82L${X0 + 2 * q} 108L${X0 + 3 * q} 82L${X1} 108V${GY}Z"/>`; top = 82;
  } else if (d.shape === 'cyl') {
    const r = clamp((d.h / Math.max(d.b, 0.1)) * 150, 6, 44);
    roof = `<path class="bld" d="M${X0} ${GY}V108Q${(X0 + X1) / 2} ${108 - 2 * r} ${X1} 108V${GY}Z"/>`; top = 108 - r;
  } else if (d.shape === 'tall') {
    roof = `<path class="bld" d="M${X0} ${GY}V30H${X0 + 64}V${GY}Z"/><path class="bld" d="M${X0 + 64} ${GY}V100H${X1}V${GY}Z"/>`;
    lx0 = X0 + 64; yb = 98; extra = `<text x="${X0 + 32}" y="76" text-anchor="middle" class="t2">wyższy</text>`;
  } else if (d.shape === 'obst') {
    roof = `<path class="bld" d="M${X0} ${GY}V80H${X0 + 6}V100H${X1}V${GY}Z"/>`;
    lx0 = X0 + 6; yb = 98; extra = `<text x="${X0 + 10}" y="76" class="t2">attyka</text>`;
  } else if (d.shape === 'over') {
    return fig(`<svg viewBox="0 0 300 132" role="img" aria-label="Nawis śnieżny"><path class="bld" d="M30 ${GY}V92L230 80V${GY}Z"/><path class="ld" d="M30 92L230 80L230 70L30 82Z"/><path class="ld" d="M230 70C246 70 256 78 254 90C252 100 240 102 236 94C232 88 236 82 230 80Z"/>${arrow(262, 66, 248, 84)}<text x="262" y="60">s<tspan dy="2" font-size="8">e</tspan></text><text x="110" y="64" class="t2">warstwa śniegu d</text><line class="gnd" x1="10" y1="${GY}" x2="290" y2="${GY}"/></svg>`, 'Nawis na krawędzi dachu – obciążenie liniowe s<sub>e</sub> [kN/m]');
  } else if (d.shape === 'guard') {
    const a = clamp(d.a1 || 30, 5, 70), x1 = 50, y1 = 112, L = 230, x2 = x1 + L * Math.cos(rad(a)) * 0.95, y2 = y1 - Math.min(L * Math.sin(rad(a)), 96);
    const ca = Math.cos(rad(a)), sa = Math.sin(rad(a));
    const gx = x1 + 30 * ca, gy = y1 - 30 * sa;
    return fig(`<svg viewBox="0 0 300 132" role="img" aria-label="Bariera przeciwśnieżna"><line class="roof" x1="${x1}" y1="${y1}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/><line class="roof" x1="${gx.toFixed(1)}" y1="${gy.toFixed(1)}" x2="${(gx - 10 * sa).toFixed(1)}" y2="${(gy - 10 * ca).toFixed(1)}" style="stroke-width:3"/><path class="ld" d="M${gx.toFixed(1)} ${gy.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}L${(x2 - 8 * sa).toFixed(1)} ${(y2 - 8 * ca).toFixed(1)}L${(gx - 8 * sa).toFixed(1)} ${(gy - 8 * ca).toFixed(1)}Z"/>${arrow(gx + 70 * ca - 14 * sa, gy - 70 * sa - 14 * ca, gx + 18 * ca - 14 * sa, gy - 18 * sa - 14 * ca)}<text x="${(gx + 50 * ca - 26 * sa).toFixed(1)}" y="${(gy - 50 * sa - 26 * ca).toFixed(1)}">F<tspan dy="2" font-size="8">s</tspan></text><text x="${x1 + 40}" y="${y1 + 10}" class="t2">α = ${F(a, 0)}°</text><line class="gnd" x1="${x1}" y1="${y1}" x2="${x1 + 120}" y2="${y1}"/></svg>`, 'Bariera przeciwśnieżna – siła F<sub>s</sub> [kN/m]');
  }
  if (yb === undefined) yb = top - 6;

function matList() {

<script>/* js/main.js */

}
function example() {

function autoGroups() {
  const lays = S.perm.filter(p => p.type !== 'line');

  lays.forEach(p => {
    if (S.groups.some(g => g.perm.includes(p.id))) return;

    const vars = [];

async function fetchElev(lat, lon) {

    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch('https://api.open-meteo.com/v1/elevation?latitude=' + lat.toFixed(5) + '&longitude=' + lon.toFixed(5), { signal: ctl.signal });
    clearTimeout(t);
    const d = await r.json(); const e = d && d.elevation && d.elevation[0];
    return isNum(e) ? Math.round(e) : null;
  } catch (e) { return null; }
}
(function mapEvents() {
  let drag = null;
  document.addEventListener('pointerdown', e => {
    const svg = e.target.closest('svg[data-map]'); if (!svg) return;
    const vb = svg.viewBox.baseVal;
    drag = { svg, x: e.clientX, y: e.clientY, vb: { x: vb.x, y: vb.y, w: vb.width, h: vb.height }, moved: false, k: vb.width / svg.getBoundingClientRect().width };
    try { svg.setPointerCapture(e.pointerId); } catch (er) { }
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    const v = drag.vb;
    MAPV = { x: v.x - dx * drag.k, y: v.y - dy * drag.k, w: v.w, h: v.h };
    drag.svg.setAttribute('viewBox', `${MAPV.x.toFixed(1)} ${MAPV.y.toFixed(1)} ${MAPV.w.toFixed(1)} ${MAPV.h.toFixed(1)}`);
  });
  document.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) return;
    const pt = d.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const m = d.svg.getScreenCTM(); if (!m) return;
    const p = pt.matrixTransform(m.inverse());
    const lon = SVG.ilon(p.x), lat = SVG.ilat(p.y);
    if (lon < 13.8 || lon > 24.5 || lat < 48.8 || lat > 55.2) return;
    const la = +lat.toFixed(5), lo = +lon.toFixed(5);
    locSet({ name: '', desc: 'punkt wskazany na mapie', kind: 'punkt', lat: la, lon: lo, A: null, keepA: true, zoom: false, src: 'mapa', aNote: 'Wysokość A pozostawiono bez zmian (' + (isNum(S.loc.A) ? F(S.loc.A, 0) + ' m' : 'brak') + ') – sprawdź rzędną terenu dla wskazanego miejsca (pobieram z internetu…).' });
    fetchElev(la, lo).then(A => {
      if (S.loc.lat !== la || S.loc.lon !== lo) return;
      if (!isNum(A)) { S.loc.aNote = 'Nie udało się pobrać wysokości (brak internetu) – wpisz rzędną terenu A dla wskazanego miejsca.'; changed(S.ui.tab === 'proj'); return; }
      S.loc.A = A; S.loc.aNote = ''; S.loc.src = 'mapa; A: Copernicus DEM (Open-Meteo)'; locApply(); changed(true); toast('A = ' + A + ' m n.p.m. (Copernicus DEM, Open-Meteo)');
    });
  });
  document.addEventListener('pointercancel', () => { drag = null; });
  document.addEventListener('wheel', e => {
    const svg = e.target.closest('svg[data-map]'); if (!svg || !e.ctrlKey && !e.altKey) return;
    e.preventDefault();
    const v = MAPV || { x: 0, y: 0, w: SVG.MAP_W, h: SVG.MAP_H };

})();

function colOfEl(el) { const d = el.closest('details.item'); return d ? { col: d.dataset.col, id: d.dataset.id } : null; }
function cloneItem(o) { const c = JSON.parse(JSON.stringify(o)); c.id = uid(); if (c.layers) c.layers.forEach(L => L.id = uid()); c.name = (c.name || '') + ' (kopia)'; return c; }
function itemAction(act, col, id) {
  const arr = S[col]; const i = arr.findIndex(x => x.id === id); if (i < 0) return;
  if (act === 'up' && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; }
  else if (act === 'down' && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; }
  else if (act === 'dup') { snap(); const c = cloneItem(arr[i]); arr.splice(i + 1, 0, c); S.ui.act[TAB_OF[col]] = c.id; }
  else if (act === 'del') {
    snap();
    const nm = arr[i].name;
    arr.splice(i, 1);
    S.groups.forEach(g => { g.perm = g.perm.filter(x => x !== id); g.vars = g.vars.filter(v => v.ref !== col + ':' + id); });
    S.perm.forEach(p => { if (p.wallRef === id) p.wallRef = ''; });

}
function addItem(col, type) {

  else if (col === 'imp') it = newImp(type);
  else if (col === 'snow') it = newSnow(type);
  else if (col === 'wind') { it = newWind(type); if (['walls', 'flat', 'mono', 'duo', 'hip'].includes(type) && S.wiz) Object.assign(it, { h: num(S.wiz.H, 10), b: num(S.wiz.L, 20), d: num(S.wiz.B, 12) }); }

  delete S.ui.closed[it.id];

}

  const d = e.target; if (!d.matches || !d.matches('details.grp')) return;
  const key = d.dataset.id ? (d.classList.contains('site') ? d.dataset.col + d.dataset.id : d.dataset.id) : null;
  if (key) { if (d.open) delete S.ui.closed[key]; else S.ui.closed[key] = 1; save(); }
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); closeModal(); }
  if (e.target.id === 'locq' && e.key === 'Enter') { e.preventDefault(); if (LOC_RES[0]) locPick(LOC_RES[0]); }
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveProject(e.shiftKey); }
  else if (k === 'o') { e.preventDefault(); openProject(); }
  else if (k === 'p') { e.preventDefault(); showTab('rep'); setTimeout(() => window.print(), 250); }
  else if (k === 'n' && e.altKey === false && e.shiftKey === false) { /* Ctrl+N bywa zarezerwowane przez przeglądarkę */ }
});
/* rozdzielacz paneli */
(function splitter() {
  let sp = null;
  document.addEventListener('pointerdown', e => { const d = e.target.closest('.dsplit'); if (!d) return; const w = d.parentElement; sp = { w, r: w.getBoundingClientRect() }; e.preventDefault(); });
  document.addEventListener('pointermove', e => { if (!sp) return; const p = clamp((e.clientX - sp.r.left) / sp.r.width * 100, 30, 75); sp.w.style.setProperty('--lw', p.toFixed(1) + '%'); S.ui.lw = p; });
  document.addEventListener('pointerup', () => { if (sp) { sp = null; save(); } });
  document.addEventListener('dblclick', e => { const d = e.target.closest('.dsplit'); if (!d) return; S.ui.lw = 50; d.parentElement.style.setProperty('--lw', '50%'); save(); });
})();
$('#fileIn').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => loadText(String(rd.result), f.name); rd.readAsText(f); e.target.value = ''; });
document.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return; e.preventDefault(); const rd = new FileReader(); rd.onload = () => loadText(String(rd.result), f.name); rd.readAsText(f); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- start ---------- */
(function boot() {
  let th = ''; try { th = localStorage.getItem(LS_THEME) || ''; } catch (e) { }
  applyTheme(th);
  S = loadState() || example();
  R = compute();
  $('#projName').value = S.meta.name || '';
  $('#projName').addEventListener('change', () => { S.meta.name = $('#projName').value; changed(false); });
  renderStatus();
  showTab(S.ui.tab || 'proj');
  window.__OEC = { get S() { return S; }, get R() { return R; }, EC, genProject, example, compute: () => (R = compute()) };
})();

</script>
